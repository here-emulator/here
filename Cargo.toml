# allow setting rustflags in profiles
cargo-features = ["profile-rustflags"]

[workspace]
resolver = "3"
members = [
    "crates/here-types",
    "crates/here-device",
    "crates/here-isa",
    "crates/here-jit",
    "crates/here-board",
    "crates/here-dbg",
    "crates/here-bin",
    "crates/here-wasm",
    "crates/here-test-support",
]

[workspace.package]
version = "0.2.0-beta.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]

here-board = { path = "crates/here-board", default-features = false }
here-dbg = { path = "crates/here-dbg", default-features = false }
here-device = { path = "crates/here-device", default-features = false }
here-isa = { path = "crates/here-isa", default-features = false }
here-jit = { path = "crates/here-jit", default-features = false }
here-test-support = { path = "crates/here-test-support" }
here-types = { path = "crates/here-types" }

xmas-elf = "0.7.0"
log = "0.4"
rand = { version = "0.9.2", default-features = false, features = ["std"] }
seq-macro = "0.3.0"
lazy_static = "1.5.0"
rand_chacha = { version = "0.9.0", default-features = false, features = [
    "std",
] }
thiserror = "1.0"
smallvec = "1.15.1"
phf = { version = "0.12", features = ["macros"] }
bitflags = "2.9.3"
rustc_apfloat = "0.2.3"
num_enum = "0.7.4"
bit-set = "0.8.0"
gdbstub_arch = "0.3.3"
num-traits = "0.2.19"
noline = { version = "0.5.1", default-features = false, features = ["alloc"] }
embedded-io = "0.6.1"
embedded-io-async = "0.6.1"
bitfield-struct = "0.13.0"
rustc-hash = "2.1.3"
clap = { version = "4.5.43", features = ["derive"] }
flexi_logger = "0.31.2"
crossterm = "0.28"
gdbstub = "0.7.10"
tokio = "1.53.1"
region = "3.0.2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }
js-sys = "0.3"
console_error_panic_hook = "0.1.7"
wasm-logger = "0.2.0"
serde_json = "1.0.142"
regex = "1.12.3"

# For `cargo flamegraph`.
# > Note: If you're using lld (which is the default since Rust 1.90.0) or mold on Linux, you must use the --no-rosegment flag.
# > Otherwise perf will not be able to generate accurate stack traces (explanation).
# See: https://github.com/flamegraph-rs/flamegraph
[profile.flamegraph]
inherits = "release"
rustflags = ["-Clink-arg=-Wl,--no-rosegment"]
debug = true

[profile.fast-debug]
inherits = "dev"
rustflags = ["-Clink-arg=-Wl,--no-rosegment"]

opt-level = 2
debug = true
debug-assertions = true
overflow-checks = false

lto = "off"
codegen-units = 16
incremental = true

[profile.dev]
debug = true

[workspace.lints.rust]
unused_imports = "warn"
