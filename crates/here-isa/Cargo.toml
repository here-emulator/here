[package]
name = "here-isa"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["riscv64"]
riscv32 = ["here-types/riscv32", "here-device/riscv32"]
riscv64 = ["here-types/riscv64", "here-device/riscv64"]
custom-instr = ["riscv64"]
test-support = ["here-device/test-support"]

[dependencies]
here-device = { workspace = true }
here-types = { workspace = true }
bitflags.workspace = true
log.workspace = true
num-traits.workspace = true
phf.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rustc_apfloat.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
thiserror.workspace = true

[build-dependencies]
regex.workspace = true
serde_json.workspace = true

[dev-dependencies]
here-device = { workspace = true, features = ["test-support"] }

